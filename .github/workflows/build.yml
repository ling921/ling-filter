name: Publish NuGet Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional package version; defaults to the project version
        required: false
        type: string
  release:
    types:
      - published

concurrency:
  group: publish-nuget
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  publish:
    environment: production
    env:
      NUGET_DIRECTORY: ${{ github.workspace }}/artifacts/package
      RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-env
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x
            11.0.x

      - name: Restore dependencies
        run: dotnet restore Ling.Filter.slnx

      - name: Build and Test
        run: |
          dotnet build Ling.Filter.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -warnaserror
          dotnet test Ling.Filter.slnx --configuration Release --no-build --no-restore --verbosity normal

      - name: Pack
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          arguments=(src/Ling.Filter/Ling.Filter.csproj --configuration Release --no-restore --output "$NUGET_DIRECTORY" -p:ContinuousIntegrationBuild=true)
          if [ -n "$version" ]; then arguments+=("-p:Version=$version"); fi
          dotnet pack "${arguments[@]}"

      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        shell: bash
        run: |
          for package in "$NUGET_DIRECTORY"/*.nupkg; do
            case "$package" in *.snupkg) continue ;; esac
            dotnet nuget push "$package" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
